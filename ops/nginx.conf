# nginx in front of a single Daphne instance. No ip_hash, no upstream
# pool -- that story (multiple ASGI instances, a Redis bridge stitching
# them together) already got told in websocket-presence-board. The thing
# worth showing here is simpler: what an upgrade proxy needs regardless
# of how many instances sit behind it.

events { worker_connections 1024; }

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        client_max_body_size 1m;  # uploads go straight to S3, never through here

        location /ws/ {
            proxy_pass http://app:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
