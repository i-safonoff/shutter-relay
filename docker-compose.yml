services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports: ["5544:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - relay-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: relay-minio
      MINIO_ROOT_PASSWORD: relay-minio-secret
    ports:
      - "9100:9000"
      - "9102:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - relay-minio-data:/data

  # imgproxy needs the *same* bucket credentials as Django to read
  # originals for resizing -- it is a second, independent S3 client, not
  # something that goes through the Django process at all.
  imgproxy:
    image: darthsim/imgproxy:latest
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: relay-minio
      AWS_SECRET_ACCESS_KEY: relay-minio-secret
      IMGPROXY_TTL: "3600"
    ports: ["9101:8080"]
    depends_on:
      minio:
        condition: service_healthy

volumes:
  relay-pg-data:
  relay-minio-data:
